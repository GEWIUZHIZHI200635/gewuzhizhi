<!DOCTYPE html>

<html>

<head>

<title>
伊犁实时气象监测
</title>

<style>

body {

    text-align:center;

    margin:0;

    font-family:"Microsoft YaHei";

    background:#f5f8fc;

    color:#222;

}


h1{

    margin-top:35px;

    font-size:34px;

    letter-spacing:3px;

}


h2{

    margin-top:10px;

    font-size:24px;

}


/* 信息区域 */

#weather > p{

    color:#666;

    font-size:15px;

    margin:8px;

}


/* 实时天气区域 */

.cards {

    width:850px;

    margin:35px auto;

    display:grid;

    grid-template-columns:repeat(4,180px);

    gap:25px;

    justify-content:center;

}


/* 单个实时卡片 */

.card {

    padding:25px 15px;

    border-radius:18px;

    text-align:center;

    background:white;

    width:150px;

    min-height:100px;

    box-shadow:0 5px 15px rgba(0,0,0,0.08);

    border:1px solid #e5e5e5;

    transition:.3s;

}


.card:hover{

    transform:translateY(-5px);

}


.card div{

    font-size:17px;

    color:#666;

}


.card strong {

    display:block;

    font-size:30px;

    margin-top:15px;

    color:#111;

}


/* 未来7天天气 */

.forecast {

    width:1000px;

    margin:30px auto;

    display:grid;

    grid-template-columns:repeat(7,130px);

    justify-content:center;

    gap:15px;

}


/* 未来天气卡片 */

.forecast-card {

    padding:20px 10px;

    border-radius:16px;

    background:white;

    border:1px solid #e5e5e5;

    box-shadow:0 4px 12px rgba(0,0,0,.06);

    font-size:15px;

}


.forecast-card strong {

    display:block;

    font-size:22px;

    margin:18px 0;

}


/* 自适应 */

@media(max-width:900px){

.cards{

    width:95%;

    grid-template-columns:repeat(2,180px);

}


.forecast{

    width:95%;

    grid-template-columns:repeat(3,130px);

}

}


</style>


</head>

<body>


<h1>
霍尔果斯市实时气象要素监测
</h1>

<p id="weather">
正在获取天气数据……
</p>


<script>

fetch("https://api.open-meteo.com/v1/forecast?latitude=44.2&longitude=80.86&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,pressure_msl,precipitation,weather_code,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=8&timezone=Asia%2FShanghai")

.then(response => response.json())

.then(data => {

let time = data.current.time;

let date = new Date(time);

let year = date.getFullYear();

let month = date.getMonth() + 1;

let day = date.getDate();

let hour = String(date.getHours()).padStart(2,"0");

let minute = String(date.getMinutes()).padStart(2,"0");

let timeText =
    year + "年" +
    month + "月" +
    day + "日 " +
    hour + ":" +
    minute;

let weatherCode = data.current.weather_code;

let weatherText;

let visibilityText;

if(data.current.visibility >= 10000){
    visibilityText = "≥10000 m";
}
else{
    visibilityText = data.current.visibility + " m";
}

if (weatherCode == 0 || weatherCode == 1) {
    weatherText = "晴";
}
else if (weatherCode == 2 || weatherCode == 3) {
    weatherText = "多云";
}
else if (weatherCode == 45 || weatherCode == 48) {
    weatherText = "雾";
}
else if (weatherCode == 51 || weatherCode == 53 || weatherCode == 55 || weatherCode == 56 || weatherCode == 57) {
    weatherText = "毛毛雨";
}
else if (weatherCode == 61) {
    weatherText = "小雨";
}
else if (weatherCode == 63) {
    weatherText = "中雨";
}
else if (weatherCode == 65) {
    weatherText = "大雨";
}
else if (weatherCode == 66 || weatherCode == 67) {
    weatherText = "冻雨";
}
else if (weatherCode == 71) {
    weatherText = "小雪";
}
else if (weatherCode == 73) {
    weatherText = "中雪";
}
else if (weatherCode == 75) {
    weatherText = "大雪";
}
else if (weatherCode == 77) {
    weatherText = "雪粒";
}
else if (weatherCode == 80 || weatherCode == 81 || weatherCode == 82) {
    weatherText = "阵雨";
}
else if (weatherCode == 85 || weatherCode == 86) {
    weatherText = "阵雪";
}
else if (weatherCode == 95) {
    weatherText = "雷暴";
}
else if (weatherCode == 96 || weatherCode == 99) {
    weatherText = "雷暴伴冰雹";
}
else {
    weatherText = "其他天气";
}


let windDirection = data.current.wind_direction_10m;

let windText;

if (windDirection >= 337.5 || windDirection < 22.5) {
    windText = "北风";
}
else if (windDirection < 67.5) {
    windText = "东北风";
}
else if (windDirection < 112.5) {
    windText = "东风";
}
else if (windDirection < 157.5) {
    windText = "东南风";
}
else if (windDirection < 202.5) {
    windText = "南风";
}
else if (windDirection < 247.5) {
    windText = "西南风";
}
else if (windDirection < 292.5) {
    windText = "西风";
}
else {
    windText = "西北风";
}


let forecast = "";

for (let i = 1; i < 8; i++) {

    let date = data.daily.time[i];

    let weatherCode = data.daily.weather_code[i];

    let forecastWeatherText;

if (weatherCode == 0 || weatherCode == 1) {
    forecastWeatherText = "晴";
}
else if (weatherCode == 2 || weatherCode == 3) {
    forecastWeatherText = "多云";
}
else if (weatherCode == 45 || weatherCode == 48) {
    forecastWeatherText = "雾";
}
else if (weatherCode == 51 || weatherCode == 53 || weatherCode == 55 || weatherCode == 56 || weatherCode == 57) {
    forecastWeatherText = "毛毛雨";
}
else if (weatherCode == 61) {
    forecastWeatherText = "小雨";
}
else if (weatherCode == 63) {
    forecastWeatherText = "中雨";
}
else if (weatherCode == 65) {
    forecastWeatherText = "大雨";
}
else if (weatherCode == 66 || weatherCode == 67) {
    forecastWeatherText = "冻雨";
}
else if (weatherCode == 71) {
    forecastWeatherText = "小雪";
}
else if (weatherCode == 73) {
    forecastWeatherText = "中雪";
}
else if (weatherCode == 75) {
    forecastWeatherText = "大雪";
}
else if (weatherCode == 77) {
    forecastWeatherText = "雪粒";
}
else if (weatherCode == 80 || weatherCode == 81 || weatherCode == 82) {
    forecastWeatherText = "阵雨";
}
else if (weatherCode == 85 || weatherCode == 86) {
    forecastWeatherText = "阵雪";
}
else if (weatherCode == 95) {
    forecastWeatherText = "雷暴";
}
else if (weatherCode == 96 || weatherCode == 99) {
    forecastWeatherText = "雷暴伴冰雹";
}
else {
    forecastWeatherText = "其他天气";
}

    forecast +=
    "<div class='forecast-card'>" +
    "<div>" + date + "</div>" +
    "<strong>" + forecastWeatherText + "</strong>" +
    "<div>" +
    data.daily.temperature_2m_max[i] + "℃ / " +
    data.daily.temperature_2m_min[i] + "℃" +
    "</div>" +
    "</div>";
}


document.getElementById("weather").innerHTML =

"<p>更新时间：" + timeText + "</p>" +

"<p>数据来源：Open-Meteo</p>" +

"<div class='cards'>" +

"<div class='card'>" +
"<div>天气状况</div>" +
"<strong>" + weatherText + "</strong>" +
"</div>" +

"<div class='card'>" +
"<div>气温</div>" +
"<strong>" + data.current.temperature_2m + " ℃</strong>" +
"</div>" +

"<div class='card'>" +
"<div>相对湿度</div>" +
"<strong>" + data.current.relative_humidity_2m + " %</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风速</div>" +
"<strong>" + (data.current.wind_speed_10m / 3.6).toFixed(1) + " m/s</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风向</div>" +
"<strong>" + windText + "</strong>" +
"</div>" +

"<div class='card'>" +
"<div>海平面气压</div>" +
"<strong>" + data.current.pressure_msl + " hPa</strong>" +
"</div>" +

"<div class='card'>" +
"<div>降水</div>" +
"<strong>" + data.current.precipitation + " mm</strong>" +
"</div>" +

"<div class='card'>" +
"<div>能见度</div>" +
"<strong>" + visibilityText + "</strong>" +
"</div>" +

"</div>" +

"<h2>未来7天天气</h2>" +

"<div class='forecast'>" +
forecast +
"</div>";

})
.catch(error => {
    document.getElementById("weather").innerHTML =
    "<p>天气数据获取失败，请检查网络连接或稍后重试。</p>";
    console.error(error);
});

</script>


</body>

</html>
