<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伊犁实时气象监测</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    background:#f7f9fc;
    font-family:"Microsoft YaHei",sans-serif;
    color:#222;
}
.container{
    max-width:1100px;
    margin:0 auto;
    padding:35px 20px;
}
.header{
    text-align:center;
    margin-bottom:35px;
}
.header h1{
    font-size:32px;
    margin:0 0 12px;
    letter-spacing:2px;
}
.header h2{
    font-size:22px;
    margin:0 0 15px;
    font-weight:500;
}
.info{
    color:#666;
    font-size:15px;
    line-height:1.8;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    margin:25px 0 18px;
    text-align:center;
}

.current-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}
.card{
    background:white;
    border-radius:18px;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
    border:1px solid #eee;
}
.card .label{
    color:#666;
    font-size:17px;
    margin-bottom:12px;
}
.card .value{
    font-size:28px;
    font-weight:bold;
}
.card:nth-child(5),
.card:nth-child(6),
.card:nth-child(7){
    grid-column:auto;
}

.forecast-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:12px;
}
.forecast-card{
    background:white;
    border-radius:16px;
    padding:18px 8px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}
.date{
    font-size:14px;
    color:#555;
}
.weather{
    font-size:20px;
    font-weight:bold;
    margin:18px 0;
}
.temp{
    font-size:15px;
}

@media(max-width:850px){
    .current-grid{grid-template-columns:repeat(2,1fr)}
    .forecast-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:500px){
    .current-grid,.forecast-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>伊犁实时气象监测</h1>
<h2>伊宁市</h2>
<div class="info">
更新时间：2026年9月14日 20:0<br>
数据来源：Open-Meteo
</div>
</div>

<div class="section-title">实时天气</div>

<div class="current-grid">
<div class="card"><div class="label">天气状况</div><div class="value">晴</div></div>
<div class="card"><div class="label">气温</div><div class="value">30.7℃</div></div>
<div class="card"><div class="label">相对湿度</div><div class="value">25%</div></div>
<div class="card"><div class="label">风速</div><div class="value">3.7 m/s</div></div>
<div class="card"><div class="label">风向</div><div class="value">东南风</div></div>
<div class="card"><div class="label">海平面气压</div><div class="value">1012.5 hPa</div></div>
<div class="card"><div class="label">降水</div><div class="value">0 mm</div></div>
</div>

<div class="section-title">未来7天天气</div>

<div class="forecast-grid">
<div class="forecast-card"><div class="date">09-15</div><div class="weather">晴</div><div class="temp">32.6℃ / 17.3℃</div></div>
<div class="forecast-card"><div class="date">09-16</div><div class="weather">多云</div><div class="temp">31℃ / 17.5℃</div></div>
<div class="forecast-card"><div class="date">09-17</div><div class="weather">晴</div><div class="temp">29.5℃ / 15.2℃</div></div>
<div class="forecast-card"><div class="date">09-18</div><div class="weather">多云</div><div class="temp">30.5℃ / 14.7℃</div></div>
<div class="forecast-card"><div class="date">09-19</div><div class="weather">多云</div><div class="temp">33℃ / 15.4℃</div></div>
<div class="forecast-card"><div class="date">09-20</div><div class="weather">多云</div><div class="temp">31.9℃ / 16.9℃</div></div>
<div class="forecast-card"><div class="date">09-21</div><div class="weather">多云</div><div class="temp">31.9℃ / 17.2℃</div></div>
</div>

</div>
</body>
</html>
