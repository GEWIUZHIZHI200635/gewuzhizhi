<!DOCTYPE html>

<html>

<head>

<title>
伊犁实时气象监测
</title>

<style>

.cloud {

    position:absolute;

    top:100px;

    left:-200px;

    font-size:90px;

    animation:cloudMove 20s linear infinite;

}


@keyframes cloudMove {


    from {

        transform:translateX(0);

    }


    to {

        transform:translateX(140vw);

    }


}
    
    
.sun {

    position:absolute;

    top:80px;

    right:150px;

    font-size:100px;

    animation:sunMove 8s infinite alternate;

}


@keyframes sunMove {

    from {

        transform:translateY(0);

    }


    to {

        transform:translateY(30px);

    }

}


    
#weather-bg {

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    z-index:-1;

    overflow:hidden;

}

    
.weather-icon {

font-size:50px;
margin:15px;
    
}
    
body {

    text-align:center;

    margin:0;

    min-height:100vh;

    background:
    linear-gradient(
    180deg,
    #87ceeb,
    #f5fbff
    );

    font-family:
    "Microsoft YaHei",
    sans-serif;

}

.forecast {

width:1100px;

grid-template-columns:

repeat(7,1fr);

}

.forecast-card {


padding:25px;


border-radius:22px;


background:

rgba(255,255,255,0.35);


backdrop-filter:blur(10px);


box-shadow:

0 8px 20px rgba(0,0,0,0.12);


}

.forecast-card strong {
    display:block;
    font-size:24px;
    margin:15px 0;
}
    
.card {


    padding:30px;


    border-radius:25px;


    text-align:center;


    background:

    rgba(255,255,255,0.45);


    backdrop-filter:blur(10px);


    box-shadow:

    0 10px 30px rgba(0,0,0,0.15);


    font-size:18px;


    min-height:120px;


}

.cards {


width:1000px;


grid-template-columns:

repeat(4,1fr);


}

.card strong {


display:block;


font-size:36px;


margin-top:15px;


color:#123;


}
    
</style>

    
</head>

<body>

<div id="weather-bg"></div>

    
<h1>
伊犁实时气象监测
</h1>

<h2>
伊宁市
</h2>

<p id="weather">
正在获取天气数据……
</p>


<script>

fetch("https://api.open-meteo.com/v1/forecast?latitude=43.92&longitude=81.32&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,pressure_msl,precipitation,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=8&timezone=Asia%2FShanghai")

.then(response => response.json())

.then(data => {

let time = data.current.time;

let date = new Date(time);

let year = date.getFullYear();

let month = date.getMonth() + 1;

let day = date.getDate();

let hour = date.getHours();

let minute = date.getMinutes();

let timeText =
    year + "年" +
    month + "月" +
    day + "日 " +
    hour + ":" +
    minute;

let weatherCode = data.current.weather_code;

let weatherText;
let weatherIcon;
let bg="";
    

if (weatherCode == 0 || weatherCode == 1) {
    weatherText = "晴";
    weatherIcon = "☀️";
    bg =
    "<div class='sun'>☀️</div>";
}
else if (weatherCode == 2 || weatherCode == 3) {
    weatherText = "多云";
    weatherIcon = "☁️";
    bg =

    "<div class='cloud'>☁️</div>" +

    "<div class='cloud' style='top:220px;animation-duration:30s;'>☁️</div>";

}
else if (weatherCode == 45 || weatherCode == 48) {
    weatherText = "雾";
}
else if (weatherCode == 51 || weatherCode == 53 || weatherCode == 55 || weatherCode == 56 || weatherCode == 57) {
    weatherText = "毛毛雨";
}
else if (weatherCode == 61) {
    weatherText = "小雨";
    weatherIcon = "🌧️";
}
else if (weatherCode == 63) {
    weatherText = "中雨";
    weatherIcon = "🌧️";
}
else if (weatherCode == 65) {
    weatherText = "大雨";
    weatherIcon = "🌧️";
}
else if (weatherCode == 66 || weatherCode == 67) {
    weatherText = "冻雨";
    weatherIcon = "🌧️";
}
else if (weatherCode == 71) {
    weatherText = "小雪";
    weatherIcon = "❄️";
}
else if (weatherCode == 73) {
    weatherText = "中雪";
    weatherIcon = "❄️";
}
else if (weatherCode == 75) {
    weatherText = "大雪";
    weatherIcon = "❄️";
}
else if (weatherCode == 77) {
    weatherText = "雪粒";
    weatherIcon = "❄️";
}
else if (weatherCode == 80 || weatherCode == 81 || weatherCode == 82) {
    weatherText = "阵雨";
    weatherIcon = "🌧️";
}
else if (weatherCode == 85 || weatherCode == 86) {
    weatherText = "阵雪";
    weatherIcon = "❄️";
}
else if (weatherCode == 95) {
    weatherText = "雷暴";
    weatherIcon = "⛈️";
}
else if (weatherCode == 96 || weatherCode == 99) {
    weatherText = "雷暴伴冰雹";
    weatherIcon = "⛈️";
}
else {
    weatherText = "其他天气";
    weatherIcon="🌈";
}


let windDirection = data.current.wind_direction_10m;

let windText;

if (windDirection >= 337.5 || windDirection < 22.5) {
    windText = "北风";
}
else if (windDirection < 67.5) {
    windText = "东北风";
}
else if (windDirection < 112.5) {
    windText = "东风";
}
else if (windDirection < 157.5) {
    windText = "东南风";
}
else if (windDirection < 202.5) {
    windText = "南风";
}
else if (windDirection < 247.5) {
    windText = "西南风";
}
else if (windDirection < 292.5) {
    windText = "西风";
}
else {
    windText = "西北风";
}


   let forecast = "";

for (let i = 1; i < 8; i++) {

    let date = data.daily.time[i];

    let weatherCode = data.daily.weather_code[i];

    let forecastWeatherText;

    if (weatherCode == 0 || weatherCode == 1) {
        forecastWeatherText = "晴";
    }
    else if (weatherCode == 2 || weatherCode == 3) {
        forecastWeatherText = "多云";
    }
    else if (weatherCode == 61) {
        forecastWeatherText = "小雨";
    }
    else if (weatherCode == 63) {
        forecastWeatherText = "中雨";
    }
    else if (weatherCode == 65) {
        forecastWeatherText = "大雨";
    }
    else if (weatherCode == 71) {
        forecastWeatherText = "小雪";
    }
    else if (weatherCode == 73) {
        forecastWeatherText = "中雪";
    }
    else if (weatherCode == 75) {
        forecastWeatherText = "大雪";
    }
    else {
        forecastWeatherText = "其他天气";
    }

    forecast +=
    "<div class='forecast-card'>" +
    "<div>" + date + "</div>" +
    "<strong>" + forecastWeatherText + "</strong>" +
    "<div>" +
    data.daily.temperature_2m_max[i] + "℃ / " +
    data.daily.temperature_2m_min[i] + "℃" +
    "</div>" +
    "</div>";
}


document.getElementById("weather-bg").innerHTML = bg;
document.getElementById("weather").innerHTML =

"<p>更新时间：" + timeText + "</p>" +

"<p>数据来源：Open-Meteo</p>" +

"<div class='cards'>" +

"<div class='card'>" +
"<div>天气状况</div>" +
"<div class='weather-icon'>" +
weatherIcon +
"</div>" +
"<strong>" +
weatherText +
"</strong>" +
"</div>" +

"<div class='card'>" +
"<div>气温</div>" +
"<strong>" + data.current.temperature_2m + " ℃</strong>" +
"</div>" +

"<div class='card'>" +
"<div>相对湿度</div>" +
"<strong>" + data.current.relative_humidity_2m + " %</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风速</div>" +
"<strong>" + (data.current.wind_speed_10m / 3.6).toFixed(1) + " m/s</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风向</div>" +
"<strong>" + windText + "</strong>" +
"</div>" +

"<div class='card'>" +
"<div>海平面气压</div>" +
"<strong>" + data.current.pressure_msl + " hPa</strong>" +
"</div>" +

"<div class='card'>" +
"<div>降水</div>" +
"<strong>" + data.current.precipitation + " mm</strong>" +
"</div>" +

"</div>" +

"<h2>未来7天天气</h2>" +

"<div class='forecast'>" +
forecast +
"</div>";

});
    
</script>


</body>

</html>
