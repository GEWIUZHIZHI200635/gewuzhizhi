<style>


.home-btn {
    position: fixed;

    bottom: 25px;
    left: 25px;

    padding: 10px 18px;

    background-color: rgba(255,255,255,0.75);

    color: #1f2d3d;

    border: 1px solid rgba(255,255,255,0.8);

    border-radius: 10px;

    text-decoration: none;

    font-size: 16px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.2);

    transition: 0.3s;
}


.home-btn:hover {
    background-color: #1f4e79;

    color: white;

    transform: translateY(-2px);
}

    
/* 页面标题 */
h1 {
    text-align: center;
    color: black;
    margin-top: 40px;
    margin-bottom: 50px;
}
    

/* 页面主体 */
body {
    width: 1200px;
    margin: auto;

    background-image: url("images/观测.jpg");
    background-size: cover;
    background-position: center 40%;
    background-attachment: fixed;
}


/* 卡片区域 */
.cards {

    display: grid;

    /* 每行4个 */
    grid-template-columns: repeat(4, 200px);

    /* 行间距、列间距 */
    gap: 30px 40px;

    /* 整体居中 */
    justify-content: center;
}


/* 卡片 */
.card {

    width: 200px;
    height: 80px;

    border: 1px solid rgba(255,255,255,0.7);

    border-radius: 15px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.25);

    display: flex;

    justify-content: center;
    align-items: center;

    transition: 0.3s;

    font-size: 24px;

    /* 默认黑色字体 */
    color: black;

    /* 半透明白色 */
    background-color: rgba(255,255,255,0.65);

    /* 去掉链接下划线 */
    text-decoration: none;
}


/* 鼠标放上去 */
.card:hover {

    background-color: #1f4e79;

    color: white;

    transform: translateY(-5px);
}

</style>

</head>
