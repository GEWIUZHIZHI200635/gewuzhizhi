```html
<!DOCTYPE html>

<html>

<head>

<title>
气象监测
</title>

<style>

body {

    margin:0;

    font-family:"Microsoft YaHei";

    background-image:url("images/风景.jpg");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

    color:#222;

    text-align:center;

}


/* 主标题 */

h1 {

    margin-top:45px;

    font-size:34px;

    letter-spacing:3px;

}


/* 分区标题 */

h2 {

    margin-top:45px;

    font-size:26px;

}


/* 伊犁州滑动区域 */

.slider {

    width:1100px;

    margin:30px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:20px;

}


/* 左右箭头 */

.arrow {

    width:50px;

    height:50px;

    border:1px solid black;

    border-radius:50%;

    background:transparent;

    box-shadow:0 5px 15px gray;

    font-size:28px;

    color:black;

    cursor:pointer;

    transition:0.3s;

    user-select:none;

}


/* 箭头悬停 */

.arrow:hover {

    background-color:#1f4e79;

    color:white;

    transform:translateY(-5px);

}


/* 按住箭头 */

.arrow:active {

    transform:scale(.92);

}


/* 卡片窗口 */

.viewport {

    width:900px;

    overflow:hidden;

}


/* 卡片容器 */

.cards {

    display:flex;

    gap:15px;

    transition:transform .4s ease;

}


/* 地区卡片 */

.card {

    flex:0 0 165px;

    height:100px;

    border:1px solid black;

    border-radius:15px;

    background:transparent;

    box-shadow:0 5px 15px gray;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:0.3s;

    font-size:21px;

    color:black;

}


/* 地区卡片悬停 */

.card:hover {

    background-color:#1f4e79;

    color:white;

    transform:translateY(-10px);

}


/* 南京 */

.nanjing {

    width:200px;

    height:100px;

    margin:30px auto;

    border:1px solid black;

    border-radius:15px;

    background:transparent;

    box-shadow:0 5px 15px gray;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:0.3s;

    font-size:21px;

    color:black;

}


/* 南京悬停 */

.nanjing:hover {

    background-color:#1f4e79;

    color:white;

    transform:translateY(-10px);

}

</style>

</head>


<body>


<h1>
气象监测
</h1>


<h2>
伊犁州
</h2>


<div class="slider">


<button
class="arrow"
id="leftButton"
>
‹
</button>


<div class="viewport">

<div class="cards" id="cards">

<div class="card">伊宁市</div>

<div class="card">奎屯市</div>

<div class="card">霍尔果斯市</div>

<div class="card">伊宁县</div>

<div class="card">霍城县</div>

<div class="card">巩留县</div>

<div class="card">新源县</div>

<div class="card">昭苏县</div>

<div class="card">特克斯县</div>

<div class="card">尼勒克县</div>

<div class="card">察布查尔锡伯自治县</div>

</div>

</div>


<button
class="arrow"
id="rightButton"
>
›
</button>


</div>


<h2>
南京市
</h2>


<div class="nanjing">
南京市
</div>


<script>

/* 当前滑动位置 */

let position = 0;


/* 每个卡片实际占用的宽度 */

let cardWidth = 180;


/* 最右边的位置 */

let maxPosition = 6;


/* 获取按钮 */

let leftButton = document.getElementById("leftButton");

let rightButton = document.getElementById("rightButton");


/* 滑动 */

function updateSlider(){

    document.getElementById("cards").style.transform =
        "translateX(-" + position * cardWidth + "px)";

}


/* 向左翻 */

function moveLeft(){

    if(position > 0){

        position--;

        updateSlider();

    }

}


/* 向右翻 */

function moveRight(){

    if(position < maxPosition){

        position++;

        updateSlider();

    }

}


/* 长按连续翻页 */

let leftTimer;

let rightTimer;


/* 左边按钮 */

leftButton.addEventListener("mousedown",function(){

    moveLeft();

    leftTimer = setInterval(function(){

        moveLeft();

    },500);

});


/* 右边按钮 */

rightButton.addEventListener("mousedown",function(){

    moveRight();

    rightTimer = setInterval(function(){

        moveRight();

    },500);

});


/* 松开鼠标 */

document.addEventListener("mouseup",function(){

    clearInterval(leftTimer);

    clearInterval(rightTimer);

});


/* 鼠标离开浏览器也停止 */

document.addEventListener("mouseleave",function(){

    clearInterval(leftTimer);

    clearInterval(rightTimer);

});

</script>


</body>

</html>
```
