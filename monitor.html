<!DOCTYPE html>

<html>

<head>

<title>
伊犁实时气象监测
</title>

</head>

<body>

<h1>
伊犁实时气象监测
</h1>

<h2>
伊宁市
</h2>

<p id="weather">
正在获取天气数据……
</p>


<script>

fetch("https://api.open-meteo.com/v1/forecast?latitude=43.92&longitude=81.32&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,pressure_msl,precipitation,weather_code")

.then(response => response.json())

.then(data => {

    let weatherCode = data.current.weather_code;

    let weatherText;

    if (weatherCode == 0) {
        weatherText = "晴";
    } 
    else if (weatherCode == 1 || weatherCode == 2 || weatherCode == 3) {
        weatherText = "多云";
    }
    else if (weatherCode >= 51 && weatherCode <= 67) {
        weatherText = "降水";
    }
    else if (weatherCode >= 71 && weatherCode <= 77) {
        weatherText = "降雪";
    }
    else if (weatherCode >= 80 && weatherCode <= 82) {
        weatherText = "阵雨";
    }
    else if (weatherCode >= 95) {
        weatherText = "雷暴";
    }
    else {
        weatherText = "其他天气";
    }


    document.getElementById("weather").innerHTML =

        "更新时间：" + data.current.time + "<br>" +
        "天气：" + weatherText + "<br>" +
        "天气代码：" + weatherCode + "<br>" +
        "气温：" + data.current.temperature_2m + " ℃<br>" +
        "相对湿度：" + data.current.relative_humidity_2m + " %<br>" +
        "风速：" + data.current.wind_speed_10m + " km/h<br>" +
        "风向：" + data.current.wind_direction_10m + "°<br>" +
        "海平面气压：" + data.current.pressure_msl + " hPa<br>" +
        "降水：" + data.current.precipitation + " mm";

});

</script>


</body>

</html>
