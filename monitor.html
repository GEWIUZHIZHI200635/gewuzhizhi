<!DOCTYPE html>

<html>

<head>

<title>
气象监测
</title>

<style>

body {

    margin:0;

    font-family:"Microsoft YaHei";

    background:#f5f8fc;

    color:#222;

    text-align:center;

}


/* 主标题 */

h1 {

    margin-top:45px;

    font-size:34px;

    letter-spacing:3px;

}


/* 分区标题 */

h2 {

    margin-top:45px;

    font-size:26px;

}


/* 伊犁州滑动区域 */

.slider {

    width:1100px;

    margin:30px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:20px;

}


/* 左右箭头 */

.arrow {

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    background:white;

    box-shadow:0 4px 12px rgba(0,0,0,.12);

    font-size:28px;

    cursor:pointer;

    transition:.3s;

}


.arrow:hover {

    background:#1f4e79;

    color:white;

}


/* 卡片窗口 */

.viewport {

    width:900px;

    overflow:hidden;

}


/* 卡片容器 */

.cards {

    display:flex;

    gap:15px;

    transition:transform .4s ease;

}


/* 地区卡片 */

.card {

    flex:0 0 165px;

    height:100px;

    border:1px solid #e5e5e5;

    border-radius:16px;

    background:white;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:21px;

    cursor:pointer;

    transition:.3s;

}


.card:hover {

    background:#1f4e79;

    color:white;

    transform:translateY(-5px);

}


/* 南京 */

.nanjing {

    width:200px;

    height:100px;

    margin:30px auto;

    border:1px solid #e5e5e5;

    border-radius:16px;

    background:white;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:21px;

    cursor:pointer;

    transition:.3s;

}


.nanjing:hover {

    background:#1f4e79;

    color:white;

    transform:translateY(-5px);

}

</style>

</head>


<body>


<h1>
气象监测
</h1>


<h2>
伊犁州
</h2>


<div class="slider">


<button class="arrow" onclick="moveLeft()">
‹
</button>


<div class="viewport">

<div class="cards" id="cards">

<div class="card">伊宁市</div>

<div class="card">奎屯市</div>

<div class="card">霍尔果斯市</div>

<div class="card">伊宁县</div>

<div class="card">霍城县</div>

<div class="card">巩留县</div>

<div class="card">新源县</div>

<div class="card">昭苏县</div>

<div class="card">特克斯县</div>

<div class="card">尼勒克县</div>

<div class="card">察布查尔锡伯自治县</div>

</div>

</div>


<button class="arrow" onclick="moveRight()">
›
</button>


</div>


<h2>
南京市
</h2>


<div class="nanjing">
南京市
</div>


<script>

let position = 0;


/* 每次移动一个卡片 */

let cardWidth = 180;


/* 最大移动位置 */

let maxPosition = 6;


/* 向左 */

function moveLeft(){

    if(position > 0){

        position--;

        updateSlider();

    }

}


/* 向右 */

function moveRight(){

    if(position < maxPosition){

        position++;

        updateSlider();

    }

}


/* 更新位置 */

function updateSlider(){

    document.getElementById("cards").style.transform =
        "translateX(-" + position * cardWidth + "px)";

}

</script>


</body>

</html>
