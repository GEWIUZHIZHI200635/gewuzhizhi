<!DOCTYPE html>

<html>

<head>

<title>
伊犁实时气象监测
</title>

<style>

.card {
    width:200px;
    padding:25px;
    border:1px solid #cccccc;
    border-radius:15px;
    text-align:center;
    background-color:#eeeeee;
    font-size:18px;
}

.cards {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card strong {
    display:block;
    font-size:30px;
    margin-top:10px;
}    
    
</style>

    
</head>

<body>

<h1>
伊犁实时气象监测
</h1>

<h2>
伊宁市
</h2>

<p id="weather">
正在获取天气数据……
</p>


<script>

fetch("https://api.open-meteo.com/v1/forecast?latitude=43.92&longitude=81.32&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,pressure_msl,precipitation,weather_code&timezone=Asia%2FShanghai")

.then(response => response.json())

.then(data => {

let time = data.current.time;

let date = new Date(time);

let year = date.getFullYear();

let month = date.getMonth() + 1;

let day = date.getDate();

let hour = date.getHours();

let minute = date.getMinutes();

let timeText =
    year + "年" +
    month + "月" +
    day + "日 " +
    hour + ":" +
    minute;

let weatherCode = data.current.weather_code;

let weatherText;

if (weatherCode == 0) {
    weatherText = "晴";
} 
else if (weatherCode == 1 || weatherCode == 2 || weatherCode == 3) {
    weatherText = "多云";
}
else if (weatherCode >= 51 && weatherCode <= 67) {
    weatherText = "降水";
}
else if (weatherCode >= 71 && weatherCode <= 77) {
    weatherText = "降雪";
}
else if (weatherCode >= 80 && weatherCode <= 82) {
    weatherText = "阵雨";
}
else if (weatherCode >= 95) {
    weatherText = "雷暴";
}
else {
    weatherText = "其他天气";
}


let windDirection = data.current.wind_direction_10m;

let windText;

if (windDirection >= 337.5 || windDirection < 22.5) {
    windText = "北风";
}
else if (windDirection < 67.5) {
    windText = "东北风";
}
else if (windDirection < 112.5) {
    windText = "东风";
}
else if (windDirection < 157.5) {
    windText = "东南风";
}
else if (windDirection < 202.5) {
    windText = "南风";
}
else if (windDirection < 247.5) {
    windText = "西南风";
}
else if (windDirection < 292.5) {
    windText = "西风";
}
else {
    windText = "西北风";
}


    document.getElementById("weather").innerHTML =

"<p>更新时间：" + timeText + "</p>" +

"<p>数据来源：Open-Meteo</p>" +

"<div class='cards'>" +

"<div class='card'>" +
"<div>气温</div>" +
"<strong>" + data.current.temperature_2m + " ℃</strong>" +
"</div>" +

"<div class='card'>" +
"<div>相对湿度</div>" +
"<strong>" + data.current.relative_humidity_2m + " %</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风速</div>" +
"<strong>" + data.current.wind_speed_10m + " km/h</strong>" +
"</div>" +

"<div class='card'>" +
"<div>风向</div>" +
"<strong>" + windText + "</strong>" +
"<div>" + data.current.wind_direction_10m + "°</div>" +
"</div>" +

"<div class='card'>" +
"<div>海平面气压</div>" +
"<strong>" + data.current.pressure_msl + " hPa</strong>" +
"</div>" +

"<div class='card'>" +
"<div>降水</div>" +
"<strong>" + data.current.precipitation + " mm</strong>" +
"</div>" +

"</div>";

});
    
</script>


</body>

</html>
