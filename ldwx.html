<!DOCTYPE html>

<html>

<head>

<title>
全国卫星云图监测
</title>


<style>

body{

    margin:0;

    text-align:center;

    font-family:"Microsoft YaHei";

    background:#f5f8fc;

    color:#222;

}


h1{

    margin-top:35px;

    font-size:34px;

    letter-spacing:3px;

}



.box{

    width:1400px;

    margin:40px auto;

    background:white;

    padding:20px;

    border-radius:18px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

}


.box img{

    width:100%;

    border-radius:15px;

}



.info{

    margin-top:15px;

    color:#666;

    font-size:15px;

}



/* 返回按钮 */

.back-btn{

    position:fixed;

    left:25px;

    bottom:25px;

    padding:10px 18px;

    background:white;

    border-radius:10px;

    text-decoration:none;

    color:#333;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

}


</style>


</head>


<body>


<a class="back-btn" href="monitor.html">
返回上一页
</a>



<h1>
全国卫星云图监测
</h1>



<div class="box">


<h2>
风云四号卫星云图
</h2>


<img id="satellite" onclick="window.open(this.src)">



<div class="info" id="update-time">

数据来源：中国气象卫星中心

<br>

图片自动更新（30分钟）

</div>


</div>



<script>


function updateSatellite(){


    let img = document.getElementById("satellite");


    img.src =

    "https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/GCLR/FY4B_REGC_GCLR.JPG?t="

    + Date.now();



    document.getElementById("update-time").innerHTML =

    "数据来源：中国气象卫星中心"

    + "<br>"

    + "网页更新时间："

    + new Date().toLocaleString()

    + "<br>"

    + "图片自动更新（15分钟）";


}



// 页面打开立即加载

updateSatellite();



// 每30分钟更新一次

setInterval(updateSatellite,900000);



</script>



</body>


</html>
