<!DOCTYPE html>

<html>

<head>

<title>
全国卫星云图监测
</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>


<style>

body{

    margin:0;

    text-align:center;

    font-family:"Microsoft YaHei";

    background:#f5f8fc;

    color:#222;

}


h1{

    margin-top:35px;

    font-size:34px;

    letter-spacing:3px;

}



.box{

    width:1400px;

    margin:40px auto;

    background:white;

    padding:20px;

    border-radius:18px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

}


.box img{

    width:100%;

    border-radius:15px;

}



.info{

    margin-top:15px;

    color:#666;

    font-size:15px;

}



/* 返回按钮 */

.back-btn{

    position:fixed;

    left:25px;

    bottom:25px;

    padding:10px 18px;

    background:white;

    border-radius:10px;

    text-decoration:none;

    color:#333;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

}


.history-btn{

    display:inline-block;

    margin-top:20px;

    padding:18px 45px;

    background:#f8fbff;

    border-radius:15px;

    text-decoration:none;

    color:#333;

    box-shadow:0 4px 12px rgba(0,0,0,.12);

    transition:.3s;

}


.history-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 8px 18px rgba(0,0,0,.18);

}


.btn-title{

    font-size:20px;

    font-weight:bold;

}


.btn-info{

    margin-top:8px;

    font-size:14px;

    color:#666;

}

    
</style>


</head>


<body>


<a class="back-btn" href="monitor.html">
返回上一页
</a>



<h1>
全国卫星云图监测
</h1>



<div class="box">


<h2>
FY-4B卫星云图
</h2>


<img id="satellite">



<div class="info" id="update-time">

数据来源：中国气象卫星中心

<br>

检查最新图片（每15分钟）

</div>


</div>


<div class="box">


<h2>
FY-4B历史云图动画
</h2>


<a class="history-btn" 
href="https://www.nsmc.org.cn/nsmc/cn/image/video.html"
target="_blank">

<div class="btn-title">
▶ 播放历史云图动画
</div>

<div class="btn-info">
查看过去72小时FY-4B卫星云图变化
</div>

</a>


</div>
    

<script>


let viewer;


// 更新卫星图片

function updateSatellite(){


    let img = document.getElementById("satellite");


    img.src =

    "https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/GCLR/FY4B_REGC_GCLR.JPG?t="

    + Date.now();



    img.onload = function(){


        // 图片加载完成后开启放大功能

        if(viewer){

            viewer.destroy();

        }


        viewer = new Viewer(img, {

            navbar:false,

            title:false,

            movable:true,

            zoomable:true

        });


    };



    document.getElementById("update-time").innerHTML =

    "数据来源：中国气象卫星中心"

    + "<br>"

    + "网页更新时间："

    + new Date().toLocaleString()

    + "<br>"

    + "检查最新图片（每15分钟）";


}



// 页面打开立即加载

updateSatellite();



// 每15分钟更新一次

setInterval(updateSatellite,900000);



</script>



</body>

</html>
