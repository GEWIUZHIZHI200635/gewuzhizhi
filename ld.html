<!DOCTYPE html>

<html>

<head>

<title>
全国雷达图监测
</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>


<style>


body{

    margin:0;

    text-align:center;

    font-family:"Microsoft YaHei";

    background:#f5f8fc;

    color:#222;

}



h1{

    margin-top:35px;

    font-size:34px;

    letter-spacing:3px;

}



.box{

    width:1400px;

    margin:40px auto;

    background:white;

    padding:20px;

    border-radius:18px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

}



.box img{

    width:100%;

    border-radius:15px;

}



.info{

    margin-top:15px;

    color:#666;

    font-size:15px;

}



/* 返回按钮 */

.home-btn {

    position: fixed;

    bottom:25px;

    left:25px;


    padding:10px 18px;


    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.85),
        rgba(230,240,250,0.65)
    );


    color:#1f2d3d;


    border:1px solid rgba(255,255,255,0.8);


    border-radius:10px;


    text-decoration:none;


    font-size:16px;


    box-shadow:0 3px 10px rgba(0,0,0,0.2);


    transition:0.3s;

}



.home-btn:hover{

    background:#1f4e79;

    color:white;

    transform:translateY(-2px);

}



.history-btn{


    display:inline-block;


    margin-top:20px;


    padding:10px 18px;


    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.85),
        rgba(230,240,250,0.65)
    );


    color:#1f2d3d;


    border:1px solid rgba(255,255,255,0.8);


    border-radius:10px;


    text-decoration:none;


    font-size:16px;


    box-shadow:0 3px 10px rgba(0,0,0,0.2);


    transition:0.3s;


}



.history-btn:hover{


    background:#1f4e79;


    color:white;


    transform:translateY(-2px);


}


</style>


</head>



<body>


<a class="home-btn" href="monitor.html">

返回上一页

</a>



<h1>

全国雷达图监测

</h1>



<div class="box">


<h2>

全国天气雷达拼图

</h2>



<img id="radar">



<div class="info" id="update-time">

数据来源：中国气象局

<br>

雷达图自动更新

</div>



</div>




<h2>

全国雷达回波历史动画

</h2>



<a class="history-btn"

href="https://www.weather.com.cn/radar/"

target="_blank">

▶ 查看雷达历史动画

</a>




<script>



let viewer;



function updateRadar(){



    let img=document.getElementById("radar");



    img.src=

    "https://www.weather.com.cn/m/i/weatherpic/2.0/radar/RADAR_2.png?t="

    +Date.now();




    img.onload=function(){


        if(viewer){

            viewer.destroy();

        }


        viewer=new Viewer(img,{

            navbar:false,

            title:false,

            movable:true,

            zoomable:true

        });



    };





    document.getElementById("update-time").innerHTML=


    "数据来源：中国气象局"

    +"<br>"

    +"网页更新时间："

    +new Date().toLocaleString()

    +"<br>"

    +"雷达图自动更新";



}





updateRadar();



setInterval(updateRadar,600000);



</script>



</body>


</html>
